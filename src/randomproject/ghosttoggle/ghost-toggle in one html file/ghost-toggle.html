<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Animated Ghost Toggle 👻</title>
  <style>
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: sans-serif;
    }

    #boo {
      color: white;
      font-size: 2em;
      margin-bottom: 12px;
      transition: opacity 0.4s ease;
    }

    #boo.hide {
      opacity: 0;
    }

    #boo.show {
      opacity: 1;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 100px;
      height: 25px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: grey;
      transition: 0.4s;
      border-radius: 34px;
    }

    input:checked + .slider {
      background-color: #459def;
    }

    input:focus + .slider {
      box-shadow: 0 0 1px #459def;
    }

    input:checked + .slider > div {
      transform: translateX(65px);
    }

    input + .slider > div {
      transition: transform 0.4s;
    }

    .ghost {
      position: absolute;
      left: 0;
      top: -10px;
      width: 40px;
      height: 40px;
      background-color: white;
      border-radius: 100px;
      animation: bobble 4.3s infinite;
      filter: drop-shadow(0px 5px 12px rgba(255, 255, 255, 0.6));
    }

    @keyframes bobble {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(15%); }
    }

    @keyframes sway {
      0%, 100% { transform: translateX(-2px); }
      50% { transform: translateX(2px); }
    }

    @keyframes sway-more {
      0%, 100% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
    }

    @keyframes blink {
      0%, 39%, 51%, 100% { top: 16px; height: 8px; }
      40%, 50% { top: 20px; height: 2px; }
    }

    .ghost:after {
      content: "";
      position: absolute;
      left: calc(50% - 7px);
      top: 16px;
      width: 10px;
      height: 8px;
      border-right: 3px solid black;
      border-left: 3px solid black;
      animation: bobble 2s infinite, sway-more 2s infinite 1s, blink 4.25s infinite;
    }

    .ghost:before {
      content: "";
      position: absolute;
      top: calc(50% - 6px);
      left: -10%;
      width: 120%;
      height: 12px;
      border-radius: 100px;
      background-color: white;
      animation: sway 2s infinite;
    }
  </style>
</head>
<body>

  <div id="boo" class="hide">Boo!</div>

  <label class="switch">
    <input id="toggle" type="checkbox" />
    <div class="slider round">
      <div><div class="ghost"></div></div>
    </div>
  </label>

  <script>
    const toggle = document.getElementById("toggle");
    const boo = document.getElementById("boo");
    let isVisible = false;

    toggle.addEventListener("change", () => {
      isVisible = !isVisible;
      if (isVisible) {
        boo.classList.remove("hide");
        boo.classList.add("show");
      } else {
        boo.classList.remove("show");
        boo.classList.add("hide");
      }
    });
  </script>

</body>
</html>
