<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Khmer Livestream Vertical Scroll</title>

  <!-- Battambang font -->
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-size: 36px;
      --text-color: #ffffff;
      --bottom-position: 5px;
      --duration: 7s;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
    }

    .scroll-container {
      position: absolute;
      bottom: var(--bottom-position);
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: hidden;
      font-family: "Battambang", "Noto Sans Khmer", "Khmer OS", sans-serif;
      font-size: var(--font-size);
      font-weight: 700;
      color: var(--text-color);
      text-shadow: 0 4px 10px rgba(0,0,0,0.85);
      letter-spacing: 1px;
    }

    .scroll-text {
      opacity: 0;
      transform: translateY(100%);
      animation: scrollUp var(--duration) ease-in-out infinite;
    }

    @keyframes scrollUp {
      0% {
        opacity: 0;
        transform: translateY(100%);
      }
      14.28% { /* ~1s fade in */
        opacity: 1;
        transform: translateY(0);
      }
      85.72% { /* ~5s stay visible */
        opacity: 1;
        transform: translateY(0);
      }
      100% {  /* ~1s fade out */
        opacity: 0;
        transform: translateY(-100%);
      }
    }
  </style>
</head>
<body>

  <div class="scroll-container">
    <div class="scroll-text">

    +855 23 222 777 | | www.phnompenhpost.com -->
